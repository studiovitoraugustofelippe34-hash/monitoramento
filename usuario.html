<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerenciamento de Usuários</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 50px;
      background-color: black;
      color: white;
    }
    h1 {
      color: cyan;
    }
    .form-box {
      border: 2px solid cyan;
      padding: 20px;
      border-radius: 10px;
      background-color: #222;
      text-align: left;
      display: inline-block;
      margin-top: 20px;
    }
    label {
      display: block;
      margin-top: 10px;
      color: cyan;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 5px;
      border: none;
    }
    .btn {
      background: cyan;
      color: black;
      font-weight: bold;
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover {
      background: white;
      color: black;
    }
    table {
      width: 90%;
      margin: auto;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid cyan;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #111;
      color: cyan;
    }
    tr:nth-child(even) {
      background-color: #222;
    }
  </style>
</head>
<body>
  <h1>Usuários com Problemas de Rede</h1>

  <!-- Formulário para adicionar usuários -->
  <div class="form-box">
    <h3>Adicionar Usuário</h3>
    <form id="usuarioForm">
      <label>Nome:</label>
      <input type="text" id="nome" required>

      <label>Status:</label>
      <select id="status">
        <option>Online</option>
        <option>Offline</option>
        <option>Pendente</option>
        <option>Concluído</option>
      </select>

      <label>Descrição do Problema:</label>
      <textarea id="problema" rows="3" required></textarea>

      <button class="btn" type="button" onclick="adicionarUsuario()">Adicionar</button>
    </form>
  </div>

  <!-- Tabela de usuários -->
  <table id="tabelaUsuarios">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Status</th>
        <th>Problema</th>
        <th>Ação</th>
      </tr>
    </thead>
    <tbody>
      <!-- Os usuários adicionados aparecerão aqui -->
    </tbody>
  </table>

  <script>
    function adicionarUsuario() {
      var nome = document.getElementById("nome").value;
      var status = document.getElementById("status").value;
      var problema = document.getElementById("problema").value;

      if(nome === "" || problema === "") {
        alert("Preencha todos os campos!");
        return;
      }

      var tabela = document.getElementById("tabelaUsuarios").getElementsByTagName("tbody")[0];
      var novaLinha = tabela.insertRow();

      var celulaNome = novaLinha.insertCell(0);
      var celulaStatus = novaLinha.insertCell(1);
      var celulaProblema = novaLinha.insertCell(2);
      var celulaAcao = novaLinha.insertCell(3);

      celulaNome.innerHTML = nome;
      celulaStatus.innerHTML = status;
      celulaProblema.innerHTML = problema;
      celulaAcao.innerHTML = '<button class="btn" onclick="excluirUsuario(this)">Excluir</button>';

      document.getElementById("usuarioForm").reset();
    }

    function excluirUsuario(botao) {
      var linha = botao.parentNode.parentNode;
      linha.parentNode.removeChild(linha);
    }
  </script>
</body>
</html>
