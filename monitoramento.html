<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Monitoramento de Rede</title>
  <style>
    body { font-family: Arial; background: #000; color: #fff; margin: 0; }
    header { background: #ff0000; padding: 20px; text-align: center; }
    h1 { margin: 0; color: #ffcc00; }
    .card { background: #111; border: 2px solid #ffcc00; margin: 20px; padding: 15px; border-radius: 8px; }
    .online { color: #00ff00; font-weight: bold; }
    .offline { color: #ff0000; font-weight: bold; }
    button { background: #ffcc00; border: none; padding: 10px; cursor: pointer; border-radius: 5px; }
    button:hover { background: #ff0000; color: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>Monitoramento de Rede Empresarial</h1>
    <p>Status em tempo real</p>
  </header>

  <div class="card">
    <p>Status da Internet: <span id="status">Verificando...</span></p>
    <button onclick="testarRede()">Testar Conexão</button>
    <button onclick="abrirRelatorio()">Abrir cronograma</button>
  </div>

  <div class="card">
    <h2 style="color:#ffcc00;">Histórico de Conexão</h2>
    <ul id="historico"></ul>
  </div>

  <script>
    function verificarConexao() {
      return navigator.onLine;
    }

    function testarRede() {
      const statusEl = document.getElementById('status');
      const historicoEl = document.getElementById('historico');
      const hora = new Date().toLocaleTimeString();

      if (verificarConexao()) {
        statusEl.textContent = "Online";
        statusEl.className = "online";
        historicoEl.innerHTML += `<li>${hora} - Online ✅</li>`;
      } else {
        statusEl.textContent = "Offline";
        statusEl.className = "offline";
        historicoEl.innerHTML += `<li>${hora} - Offline ❌</li>`;
      }
    }
function abrirRelatorio() {
  window.location.href = "./cronograma.html";
}

    // Atualiza automaticamente
    window.addEventListener('online', testarRede);
    window.addEventListener('offline', testarRede);

    testarRede();
  </script>
</body>
</html>
