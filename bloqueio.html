<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Registro de Etapas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: black;
      color: white;
      text-align: center;
      margin: 50px;
    }
    h1 {
      color: cyan;
    }
    .mensagem, .historico {
      margin-top: 30px;
      padding: 20px;
      background-color: #222;
      border: 2px solid cyan;
      border-radius: 10px;
      display: inline-block;
      text-align: left;
    }
    .historico {
      margin-top: 20px;
      width: 60%;
    }
    .btn {
      background: cyan;
      color: black;
      font-weight: bold;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 20px;
    }
    .btn:hover {
      background: white;
      color: black;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin: 5px 0;
      padding: 5px;
      border-bottom: 1px solid cyan;
    }
    #bloqueio {
      margin-top: 50px;
      padding: 20px;
      background-color: #111;
      border: 2px solid red;
      border-radius: 10px;
      display: inline-block;
    }
    input {
      padding: 10px;
      border-radius: 5px;
      border: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Registro de Etapas</h1>

  <!-- Área de bloqueio -->
  <div id="bloqueio">
    <h3>Digite a senha para acessar</h3>
    <input type="password" id="senha" placeholder="Senha de acesso">
    <br>
    <button class="btn" onclick="verificarSenha()">Entrar</button>
  </div>

  <!-- Conteúdo protegido -->
  <div id="conteudo" style="display:none;">
    <div id="mensagem" class="mensagem"></div>

    <div class="historico">
      <h3>Histórico de Registros</h3>
      <ul id="lista"></ul>
    </div>

    <button class="btn" onclick="voltar()">Voltar ao Cronograma</button>
  </div>

  <script>
    // Senha definida para acesso
    const senhaCorreta = "12345"; // você pode mudar aqui

    function verificarSenha() {
      const senhaDigitada = document.getElementById("senha").value;
      if (senhaDigitada === senhaCorreta) {
        document.getElementById("bloqueio").style.display = "none";
        document.getElementById("conteudo").style.display = "block";
        carregarConteudo();
      } else {
        alert("Senha incorreta! Tente novamente.");
      }
    }

    // Função para pegar parâmetros da URL
    function getParametro(nome) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(nome);
    }

    // Carregar conteúdo protegido
    function carregarConteudo() {
      const mensagem = getParametro("msg");
      if (mensagem) {
        document.getElementById("mensagem").textContent = mensagem;
        let registros = JSON.parse(localStorage.getItem("registros")) || [];
        registros.push(mensagem);
        localStorage.setItem("registros", JSON.stringify(registros));
      } else {
        document.getElementById("mensagem").textContent = "Nenhuma mensagem registrada.";
      }
      mostrarHistorico();
    }

    // Exibir histórico salvo
    function mostrarHistorico() {
      let registros = JSON.parse(localStorage.getItem("registros")) || [];
      const lista = document.getElementById("lista");
      lista.innerHTML = "";
      registros.forEach(reg => {
        let li = document.createElement("li");
        li.textContent = reg;
        lista.appendChild(li);
      });
    }

    // Função para voltar ao cronograma
    function voltar() {
      window.location.href = "./cronograma.html";
    }
  </script>
</body>
</html>
