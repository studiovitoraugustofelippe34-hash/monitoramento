<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel de Monitoramento</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
    }

    /* CABEÇALHO */
    header {
      background: linear-gradient(135deg, #ff0000, #8b0000);
      padding: 25px;
      text-align: center;
      border-bottom: 3px solid #ffcc00;
    }

    header h1 {
      margin: 0;
      color: #ffcc00;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
    }

    /* CONTAINER */
    .container {
      width: 95%;
      max-width: 1400px;
      margin: 25px auto;
    }

    /* CARDS */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .info-card {
      background: #111;
      border: 2px solid #ffcc00;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 0 10px rgba(255, 204, 0, .15);
    }

    .info-card h3 {
      margin: 0 0 10px;
      color: #ffcc00;
    }

    .numero {
      font-size: 30px;
      font-weight: bold;
    }

    /* PAINEL */
    .painel {
      background: #111;
      border: 2px solid #ffcc00;
      border-radius: 10px;
      padding: 20px;
    }

    .painel h2 {
      color: #ffcc00;
      margin-top: 0;
    }

    /* CONTROLES */
    .controles {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .controles input,
    .controles select {
      background: #222;
      color: white;
      border: 1px solid #555;
      padding: 12px;
      border-radius: 6px;
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-adicionar {
      background: #00aa00;
      color: white;
    }

    .btn-adicionar:hover {
      background: #00dd00;
    }

    .btn-excluir {
      background: #cc0000;
      color: white;
    }

    .btn-excluir:hover {
      background: #ff0000;
    }

    .btn-pendente {
      background: #ff9900;
      color: black;
    }

    .btn-concluido {
      background: #0088ff;
      color: white;
    }

    /* TABELA */
    .tabela-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th {
      background: #ff0000;
      color: #ffcc00;
      padding: 14px;
      text-align: left;
    }

    td {
      padding: 13px;
      border-bottom: 1px solid #333;
    }

    tr:hover {
      background: #1b1b1b;
    }

    /* STATUS */
    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-weight: bold;
    }

    .online {
      background: #063d06;
      color: #00ff44;
    }

    .offline {
      background: #3d0606;
      color: #ff3333;
    }

    .pendente {
      background: #493500;
      color: #ffb300;
    }

    .concluido {
      background: #003d55;
      color: #00aaff;
    }

    /* BOTÕES */
    .acoes {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      width: 90%;
      max-width: 450px;
      background: #111;
      border: 2px solid #ffcc00;
      border-radius: 10px;
      padding: 25px;
    }

    .modal-content h2 {
      color: #ffcc00;
    }

    .modal-content input,
    .modal-content select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: #222;
      border: 1px solid #555;
      color: white;
      border-radius: 5px;
    }

    .modal-botoes {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-cancelar {
      background: #555;
      color: white;
    }

    .btn-salvar {
      background: #00aa00;
      color: white;
    }

    /* RESPONSIVO */
    @media(max-width:600px) {

      header h1 {
        font-size: 22px;
      }

      .container {
        width: 92%;
      }

      .controles {
        flex-direction: column;
      }

      .controles input,
      .controles select,
      .controles button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>

    <h1>Painel de Monitoramento</h1>

    <p>Controle de usuários, acessos e situação da rede</p>

  </header>


  <div class="container">

    <!-- RESUMO -->
    <div class="cards">

      <div class="info-card">
        <h3>Usuários</h3>
        <div class="numero" id="totalUsuarios">0</div>
      </div>

      <div class="info-card">
        <h3>Online</h3>
        <div class="numero" id="totalOnline">0</div>
      </div>

      <div class="info-card">
        <h3>Offline</h3>
        <div class="numero" id="totalOffline">0</div>
      </div>

      <div class="info-card">
        <h3>Pendentes</h3>
        <div class="numero" id="totalPendentes">0</div>
      </div>

    </div>


    <!-- MONITORAMENTO -->
    <div class="painel">

      <h2>Monitoramento da Rede</h2>

      <div class="controles">

        <input type="text" id="pesquisa" placeholder="Pesquisar usuário..." oninput="mostrarUsuarios()">

        <select id="filtro" onchange="mostrarUsuarios()">

          <option value="todos">Todos</option>

          <option value="online">Online</option>

          <option value="offline">Offline</option>

          <option value="pendente">Pendente</option>

          <option value="concluido">Concluído</option>

        </select>

        <button class="btn-adicionar" onclick="abrirModal()">
          + Adicionar Usuário
        </button>

      </div>


      <div class="tabela-container">

        <table>

          <thead>

            <tr>

              <th>Usuário</th>

              <th>IP</th>

              <th>Dispositivo</th>

              <th>Status</th>

              <th>Situação</th>

              <th>Último acesso</th>

              <th>Ações</th>

            </tr>

          </thead>

          <tbody id="listaUsuarios"></tbody>

        </table>

      </div>

    </div>

  </div>


  <!-- MODAL -->

  <div class="modal" id="modal">

    <div class="modal-content">

      <h2>Adicionar Usuário</h2>

      <input type="text" id="novoUsuario" placeholder="Nome do usuário">

      <input type="text" id="novoIP" placeholder="IP">

      <select id="novoDispositivo">

        <option value="Computador">
          Computador
        </option>

        <option value="Celular">
          Celular
        </option>

        <option value="Tablet">
          Tablet
        </option>

      </select>

      <select id="novoStatus">

        <option value="online">
          Online
        </option>

        <option value="offline">
          Offline
        </option>

      </select>

      <div class="modal-botoes">

        <button class="btn-salvar" onclick="adicionarUsuario()">
          Salvar
        </button>

        <button class="btn-cancelar" onclick="fecharModal()">
          Cancelar
        </button>

      </div>

    </div>

  </div>


  <script>

    /* ==============================
       DADOS INICIAIS
    ============================== */

    let usuarios = JSON.parse(
      localStorage.getItem("usuariosMonitoramento")
    ) || [

        {
          id: 1,
          nome: "Cliente123",
          ip: "192.168.0.10",
          dispositivo: "Computador",
          status: "online",
          situacao: "concluido",
          acesso: "Agora"
        },

        {
          id: 2,
          nome: "Joao",
          ip: "192.168.0.11",
          dispositivo: "Celular",
          status: "online",
          situacao: "pendente",
          acesso: "19:35:20"
        },

        {
          id: 3,
          nome: "Maria",
          ip: "192.168.0.12",
          dispositivo: "Tablet",
          status: "offline",
          situacao: "pendente",
          acesso: "19:20:05"
        }

      ];


    /* ==============================
       SALVAR
    ============================== */

    function salvarDados() {

      localStorage.setItem(
        "usuariosMonitoramento",
        JSON.stringify(usuarios)
      );

    }


    /* ==============================
       MOSTRAR USUÁRIOS
    ============================== */

    function mostrarUsuarios() {

      const lista = document.getElementById(
        "listaUsuarios"
      );

      const pesquisa =
        document.getElementById(
          "pesquisa"
        ).value.toLowerCase();

      const filtro =
        document.getElementById(
          "filtro"
        ).value;

      lista.innerHTML = "";


      const filtrados = usuarios.filter(usuario => {

        const nomeCorresponde =
          usuario.nome
            .toLowerCase()
            .includes(pesquisa);

        const statusCorresponde =
          filtro === "todos" ||
          usuario.status === filtro ||
          usuario.situacao === filtro;

        return nomeCorresponde &&
          statusCorresponde;

      });


      filtrados.forEach(usuario => {

        const linha =
          document.createElement("tr");


        linha.innerHTML = `

            <td>
                <strong>
                    ${usuario.nome}
                </strong>
            </td>

            <td>
                ${usuario.ip}
            </td>

            <td>
                ${usuario.dispositivo}
            </td>

            <td>

                <span class="status ${usuario.status}">

                    ${usuario.status === "online"
            ? "● Online"
            : "● Offline"
          }

                </span>

            </td>

            <td>

                <span class="status ${usuario.situacao}">

                    ${usuario.situacao === "pendente"
            ? "Pendente"
            : "Concluído"
          }

                </span>

            </td>

            <td>
                ${usuario.acesso}
            </td>

            <td>

                <div class="acoes">

                    <button
                        class="btn-pendente"
                        onclick="alterarSituacao(${usuario.id}, 'pendente')"
                    >
                        Pendente
                    </button>

                    <button
                        class="btn-concluido"
                        onclick="alterarSituacao(${usuario.id}, 'concluido')"
                    >
                        Concluído
                    </button>

                    <button
                        class="btn-excluir"
                        onclick="excluirUsuario(${usuario.id})"
                    >
                        Excluir
                    </button>

                </div>

            </td>

        `;


        lista.appendChild(linha);

      });


      atualizarResumo();

    }


    /* ==============================
       RESUMO
    ============================== */

    function atualizarResumo() {

      document.getElementById(
        "totalUsuarios"
      ).textContent = usuarios.length;


      document.getElementById(
        "totalOnline"
      ).textContent =
        usuarios.filter(
          u => u.status === "online"
        ).length;


      document.getElementById(
        "totalOffline"
      ).textContent =
        usuarios.filter(
          u => u.status === "offline"
        ).length;


      document.getElementById(
        "totalPendentes"
      ).textContent =
        usuarios.filter(
          u => u.situacao === "pendente"
        ).length;

    }


    /* ==============================
       ALTERAR SITUAÇÃO
    ============================== */

    function alterarSituacao(id, situacao) {

      const usuario =
        usuarios.find(
          u => u.id === id
        );

      if (!usuario) return;

      usuario.situacao = situacao;

      salvarDados();

      mostrarUsuarios();

    }


    /* ==============================
       EXCLUIR
    ============================== */

    function excluirUsuario(id) {

      if (
        !confirm(
          "Deseja realmente excluir este usuário?"
        )
      ) {
        return;
      }


      usuarios =
        usuarios.filter(
          u => u.id !== id
        );


      salvarDados();

      mostrarUsuarios();

    }


    /* ==============================
       MODAL
    ============================== */

    function abrirModal() {

      document.getElementById(
        "modal"
      ).style.display = "flex";

    }


    function fecharModal() {

      document.getElementById(
        "modal"
      ).style.display = "none";

    }


    /* ==============================
       ADICIONAR USUÁRIO
    ============================== */

    function adicionarUsuario() {

      const nome =
        document.getElementById(
          "novoUsuario"
        ).value.trim();

      const ip =
        document.getElementById(
          "novoIP"
        ).value.trim();

      const dispositivo =
        document.getElementById(
          "novoDispositivo"
        ).value;

      const status =
        document.getElementById(
          "novoStatus"
        ).value;


      if (!nome) {

        alert(
          "Digite o nome do usuário."
        );

        return;

      }


      const agora =
        new Date().toLocaleTimeString();


      const novoUsuario = {

        id: Date.now(),

        nome: nome,

        ip: ip || "Não informado",

        dispositivo: dispositivo,

        status: status,

        situacao: "pendente",

        acesso: agora

      };


      usuarios.push(
        novoUsuario
      );


      salvarDados();

      mostrarUsuarios();

      fecharModal();


      document.getElementById(
        "novoUsuario"
      ).value = "";

      document.getElementById(
        "novoIP"
      ).value = "";

    }


    /* ==============================
       INICIALIZAÇÃO
    ============================== */

    mostrarUsuarios();


    /* ==============================
       SIMULAÇÃO DE MONITORAMENTO
    ============================== */

    /*
       A cada 10 segundos alguns usuários
       podem mudar de status.
    */

    setInterval(() => {

      usuarios.forEach(usuario => {

        if (Math.random() > 0.7) {

          usuario.status =
            usuario.status === "online"
              ? "offline"
              : "online";

          usuario.acesso =
            new Date().toLocaleTimeString();

        }

      });


      salvarDados();

      mostrarUsuarios();

    }, 10000);

  </script>

</body>

</html>
