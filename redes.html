<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel de Monitoramento</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #e6e6e6;
      margin: 0;
      padding: 0;
    }
    header {
      background: linear-gradient(90deg, #00bcd4, #0097a7);
      padding: 20px;
      text-align: center;
      color: black;
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .form {
      text-align: center;
      margin: 20px;
    }
    input {
      padding: 8px;
      margin: 5px;
      border-radius: 6px;
      border: none;
    }
    button {
      padding: 8px 15px;
      border-radius: 6px;
      border: none;
      background-color: #00bcd4;
      color: black;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }
    .dashboard {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 30px;
    }
    .card {
      background-color: #1e1e1e;
      border: 2px solid #00bcd4;
      border-radius: 12px;
      margin: 15px;
      padding: 25px;
      width: 280px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0,188,212,0.6);
      transition: transform 0.2s;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card h3 {
      color: #00bcd4;
      margin-bottom: 12px;
      font-size: 18px;
      text-transform: uppercase;
    }
    .status {
      font-size: 22px;
      font-weight: bold;
      margin: 12px 0;
    }
    .online {
      color: #00ff00;
      text-shadow: 0 0 10px #00ff00;
    }
    .offline {
      color: #ff3333;
      text-shadow: 0 0 10px #ff3333;
    }
    .slow {
      color: #ffff33;
      text-shadow: 0 0 10px #ffff33;
    }
  </style>
</head>
<body>
  <header>Painel de Monitoramento</header>

  <div class="form">
    <input type="text" id="ip" placeholder="Digite o IP">
    <input type="text" id="usuario" placeholder="Digite o usuário">
    <button onclick="adicionarRede()">Adicionar Rede</button>
    <button onclick="salvarRedes()">Salvar</button>
  </div>

  <div class="dashboard" id="dashboard"></div>

  <script>
    let redes = JSON.parse(localStorage.getItem("redes")) || [];

    function adicionarRede() {
      const ip = document.getElementById("ip").value;
      const usuario = document.getElementById("usuario").value;

      if (ip && usuario) {
        redes.push({ ip, usuario, status: "online" });
        atualizarPainel();
        document.getElementById("ip").value = "";
        document.getElementById("usuario").value = "";
      } else {
        alert("Preencha IP e Usuário!");
      }
    }

    function excluirRede(index) {
      redes.splice(index, 1);
      atualizarPainel();
    }

    function salvarRedes() {
      localStorage.setItem("redes", JSON.stringify(redes));
      alert("Redes salvas com sucesso!");
    }

    function atualizarPainel() {
      const dashboard = document.getElementById("dashboard");
      dashboard.innerHTML = "";

      redes.forEach((rede, index) => {
        const card = document.createElement("div");
        card.className = "card";

        const titulo = document.createElement("h3");
        titulo.textContent = `Usuário: ${rede.usuario}`;

        const ipInfo = document.createElement("div");
        ipInfo.textContent = `IP: ${rede.ip}`;

        const status = document.createElement("div");
        status.className = "status " + rede.status;
        if (rede.status === "online") {
          status.textContent = "Online ✅";
        } else if (rede.status === "slow") {
          status.textContent = "Conexão Lenta ⚠️";
        } else {
          status.textContent = "Offline ❌";
        }

        const btnExcluir = document.createElement("button");
        btnExcluir.textContent = "Excluir";
        btnExcluir.onclick = () => excluirRede(index);

        card.appendChild(titulo);
        card.appendChild(ipInfo);
        card.appendChild(status);
        card.appendChild(btnExcluir);
        dashboard.appendChild(card);
      });
    }

    // Simulação: muda status aleatoriamente a cada 10s
    setInterval(() => {
      redes.forEach(rede => {
        const estados = ["online", "slow", "offline"];
        rede.status = estados[Math.floor(Math.random() * estados.length)];
      });
      atualizarPainel();
    }, 10000);

    atualizarPainel();
  </script>
</body>
</html>
