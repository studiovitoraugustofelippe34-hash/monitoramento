<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>Pagamento - Página Inicial</title>
  <style>
    body {
      font-family: Arial;
      background: #000;
      color: #fff;
      margin: 0;
      text-align: center;
    }

    header {
      background: #ff0000;
      padding: 20px;
    }

    h1 {
      margin: 0;
      color: #ffcc00;
    }

    .container {
      padding: 30px;
    }

    .card {
      background: #111;
      border: 2px solid #ffcc00;
      padding: 20px;
      border-radius: 8px;
      margin: 20px auto;
      width: 300px;
    }

    button {
      background: #ffcc00;
      border: none;
      padding: 10px;
      cursor: pointer;
      border-radius: 5px;
      margin-top: 10px;
      width: 100%;
    }

    button:hover {
      background: #ff0000;
      color: #fff;
    }

    .pix {
      font-size: 14px;
      margin-top: 10px;
      color: #00ff00;
    }

    .info {
      margin-top: 10px;
      color: #ffcc00;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Bem-vindo ao Site</h1>
    <p>Escolha sua forma de pagamento para continuar</p>
  </header>

  <div class="container">
    <div class="card">
      <h2 style="color:#ffcc00;">Pagamento via Pix</h2>
      <p class="pix">Chave Pix (Celular): <strong>17997746829</strong></p>
      <p class="info">Nome: <strong>Vitor Augusto</strong></p>
      <p class="info">Valor: <strong>R$ 25,00</strong></p>
      <button onclick="confirmarPagamento('Pix')">Já paguei com Pix</button>
    </div>

    <div class="card">
      <h2 style="color:#ffcc00;">Teste Grátis</h2>
      <p class="info">Aproveite um acesso gratuito por 24 horas.</p>
      <button onclick="confirmarPagamento('Teste Grátis')">Usar Teste Grátis</button>
    </div>
  </div>

  <script>
    function confirmarPagamento(tipo) {
      alert("Acesso liberado via " + tipo + "!");
      window.location.href = "./monitoramento.html"; // redireciona para área restrita
    }
  </script>
</body>

</html>
