<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Monitoramento de Redes</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 50px;
      background: url('./imagem.webp') no-repeat center center fixed;
      background-size: cover;
      color: white;
    }
    .card {
      border: 2px solid yellow;
      padding: 20px;
      border-radius: 10px;
      display: inline-block;
      background-color: rgba(0,0,0,0.7);
    }
    .btn {
      background: yellow;
      color: black;
      font-weight: bold;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn:hover {
      background: white;
      color: black;
    }
    h1, h2, h3 {
      color: rgb(255, 0, 0);
    }
    h1 {
      color: rgb(0, 255, 98);
      font-size: 50px;
      font-weight: bold;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <h1>Monitoramento de Redes</h1>
  <div class="card">
    <h2>Plano Premium</h2>
    <p>✔ Teste grátis por 7 dias</p>
    <p>✔ Acesso completo após o teste</p>
    <p><strong>R$ 25,00 / mês</strong></p>
    <button class="btn" onclick="mostrarPix()">Assinar Agora</button>
  </div>

  <div id="pagamento" style="margin-top:20px; display:none;">
    <h3>Pagamento via PIX</h3>
    <p>Chave PIX: <strong>17997746829</strong></p>
    <p>Valor: R$ 25,00</p>
    <p>Após o pagamento, envie o comprovante para nosso suporte.</p>
  </div>

  <script>
    function mostrarPix() {
      // Mostra o PIX
      document.getElementById("pagamento").style.display = "block";
      // Depois de 3 segundos, redireciona
      setTimeout(function() {
        window.location.href = "./monitoramento.html";
      }, 3000);
    }
  </script>
</body>
</html>
